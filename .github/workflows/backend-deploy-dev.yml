name: Deploy Backend to EC2

on:
  push:
    branches:
      - devops
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy-dev.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-backend-ec2
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔥 BUILD IN CI (not on server)
      - name: Install & Build Backend
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma generate
          npm run build

      # 🔥 SSH SETUP
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add Host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 🔥 CREATE DIR
      - name: Ensure Backend Directory
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "mkdir -p ${{ secrets.EC2_APP_DIR }}/backend"

      # 🔥 SYNC ONLY REQUIRED FILES
      - name: Sync Backend to Server
        run: |
          rsync -az --delete \
            backend/dist \
            backend/node_modules \
            backend/package.json \
            backend/prisma \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/backend/

      # 🔥 RUN WITH PM2
      - name: Deploy Backend
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd ${{ secrets.EC2_APP_DIR }}/backend

            pm2 delete backend || true

            pm2 start dist/src/main.js --name backend

            pm2 save

          EOF
