name: Deploy Backend to EC2

on:
  push:
    branches:
      - devops
    paths:
      - 'rrf-portal-backend/**'
      - '.github/workflows/backend-deploy-dev.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-backend-ec2
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ✅ BUILD IN CI
      - name: Install & Build Backend
        working-directory: rrf-portal-backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install   # ✅ FIXED (was npm ci)
          npm run build

      # 🔥 SSH SETUP
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add Host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 🔥 CREATE DIR
      - name: Ensure Backend Directory
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "mkdir -p ${{ secrets.EC2_APP_DIR }}/rrf-portal-backend"

      # ✅ SYNC ONLY REQUIRED FILES
      - name: Sync Backend to Server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            rrf-portal-backend/dist \
            rrf-portal-backend/node_modules \
            rrf-portal-backend/package.json \
            rrf-portal-backend/prisma \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/rrf-portal-backend/

      # 🔥 DEPLOY
      - name: Deploy Backend
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd ${{ secrets.EC2_APP_DIR }}/rrf-portal-backend

            # ✅ ensure env exists
            if [ ! -f .env ]; then
              echo "⚠️ .env missing - please create it manually"
            fi

            pm2 delete rrf-portal-backend || true   # ✅ FIXED name

            # ✅ adjust path if needed
            if [ -f dist/src/main.js ]; then
              pm2 start dist/src/main.js --name rrf-portal-backend
            elif [ -f dist/main.js ]; then
              pm2 start dist/main.js --name rrf-portal-backend
            else
              echo "❌ Cannot find entry file"
              exit 1
            fi

            pm2 save

          EOF
