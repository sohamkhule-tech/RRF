name: Deploy Backend to EC2

on:
  push:
    branches:
      - devops  # Updated to match your current branch
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy-dev.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-ec2
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Backend
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma generate --schema=prisma/schema.prisma
          npm run build
          
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure app directory exists
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p '${{ secrets.EC2_APP_DIR }}/backend'"

      - name: Sync backend files
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            backend/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/backend/"
            
      - name: Deploy & Restart Backend App
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd "${{ secrets.EC2_APP_DIR }}/backend"
            
            # Install only production dependencies
            npm install --omit=dev
            
            # Generate Prisma Client
            npx prisma generate --schema=./prisma/schema.prisma
            
            # Restart using the compiled JS instead of 'npm start'
            pm2 delete backend || true
            pm2 start dist/src/main.js --name "backend"
            pm2 save
          EOF
