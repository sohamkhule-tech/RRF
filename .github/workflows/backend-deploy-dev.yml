name: Deploy Backend to EC2

on:
  push:
    branches:
      - devops
    paths:
      - 'rrf-portal-backend/**'
      - '.github/workflows/backend-deploy-dev.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-backend-ec2
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ✅ BUILD IN CI
      - name: Install & Build Backend
        working-directory: rrf-portal-backend
        run: |
          npm install
          npm run build

      # 🔥 SSH SETUP
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add Host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 🔥 CREATE DIR
      - name: Ensure Backend Directory
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "mkdir -p ${{ secrets.EC2_APP_DIR }}/rrf-portal-backend"

      # ✅ SYNC ONLY REQUIRED FILES
      - name: Sync Backend to Server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            rrf-portal-backend/dist \
            rrf-portal-backend/node_modules \
            rrf-portal-backend/package.json \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/rrf-portal-backend/

      # 🔥 DEPLOY — write pm2 ecosystem with secrets; no .env file required
      - name: Deploy Backend
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          JWT_SECRET:  ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF

            export PATH=\$PATH:/usr/bin:/usr/local/bin
            cd ${{ secrets.EC2_APP_DIR }}/rrf-portal-backend

            # Write pm2 ecosystem file with env vars from GitHub Secrets
            # This is the only source of truth for env vars in production
            cat > ecosystem.config.js << 'ECOSYSTEM'
module.exports = {
  apps: [{
    name: 'rrf-portal-backend',
    script: 'dist/src/main.js',
    instances: 1,
    autorestart: true,
    watch: false,
    env: {
      NODE_ENV: 'production',
      DB_HOST:        '${DB_HOST}',
      DB_PORT:        '${DB_PORT}',
      DB_USERNAME:    '${DB_USERNAME}',
      DB_PASSWORD:    '${DB_PASSWORD}',
      DB_DATABASE:    '${DB_DATABASE}',
      JWT_SECRET:     '${JWT_SECRET}',
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN}',
      ALLOWED_ORIGINS:'${ALLOWED_ORIGINS}',
      PORT:           '4000',
    }
  }]
}
ECOSYSTEM

            # Restart using ecosystem file (env vars are baked in at start)
            pm2 delete rrf-portal-backend || true
            pm2 start ecosystem.config.js
            pm2 save

          EOF
